---
ancestor: null
releases:
  2.1.0:
    release_date: "2026-08-03"
    changes:
      release_summary: >-
        Integrate batesste-dotfiles v1.0.2 into user_setup, git_setup, and
        claude_setup roles, wire up GPG-based git-crypt unlock via vault,
        install packer via HashiCorp apt repo in fave_packages, and fix
        TheRock stream version-detection regressions in rocm_setup.
      minor_changes:
        - >-
          user_setup — add dotfiles integration: clone batesste-dotfiles
          at a pinned version (user_setup_dotfiles_version, default v1.0.0)
          and run install.sh to stow selected packages. Controlled by
          user_setup_dotfiles_enable (default false). Installs stow and
          git-crypt (required by install.sh). DEBIAN_FRONTEND blockinfile
          is skipped when dotfiles is active. Per-package owns flags
          (user_setup_dotfiles_owns_emacs, _owns_ssh, _owns_hf) let callers
          declare which configs the stow packages take over, suppressing the
          corresponding role tasks.
        - >-
          user_setup — add GPG private key import from vault
          (user_setup_gpg_private_key) so git-crypt unlock works before
          git_setup has run. Key is written to a tempfile, imported with
          gpg --batch --import (no_log), and deleted immediately.
        - >-
          user_setup — install gettext-base (envsubst) alongside stow and
          git-crypt; required by dotfiles v1.0.1 install.sh expand_templates.
          Dotfiles v1.0.1 consolidates all secrets into a single git-crypt
          encrypted secrets/.secrets.env, stowed to ~/.secrets.env; gh/hf/
          docker tokens are no longer individual encrypted files. The vault-
          based HuggingFace token write task is removed; tokens are delivered
          via ~/.secrets.env sourced at login by the stowed .bashrc.
          git_setup_gh_authenticate disabled for AMD hosts — gh auth is now
          handled by dotfiles expand_templates writing ~/.config/gh/hosts.yml.
        - >-
          git_setup — add git_setup_dotfiles_enable flag (default false).
          When true, all git config --global tasks and the GPG_TTY
          blockinfile are skipped so the stowed .gitconfig remains the
          authoritative source.
        - >-
          git_setup — wire up vault_github_token for automated gh auth
          login on AMD hosts via git_setup_gh_authenticate and
          git_setup_gh_token inventory vars.
        - >-
          fave_packages — install packer via the HashiCorp signed apt
          repository (https://apt.releases.hashicorp.com), following the
          same get_url/dearmor/apt_repository pattern used by docker_setup.
        - >-
          rocm_setup — guard the two rocm_setup_rocm_version population
          tasks with rocm_setup_repo_stream != 'therock' to avoid
          clobbering the version when using the TheRock stream.
        - >-
          claude_setup — add claude_setup_dotfiles_enable flag (default false).
          When true, the settings.json template task is skipped so the dotfiles
          claude stow package (settings.json, CLAUDE.md) remains authoritative.
        - >-
          playbooks/hosts.yml — enable dotfiles v1.0.2 (packages: bash git gh
          secrets aws claude) for the amd group; user_setup_dotfiles_owns_claude
          and claude_setup_dotfiles_enable set true; gh auth disabled (dotfiles
          owns gh/hosts.yml via expand_templates).
  1.5.0:
    release_date: "2026-06-05"
    changes:
      release_summary: >-
        Auto-install the local collection from
        playbooks/run-ansible and fix AMD uProf CLI
        discovery after .deb install.
      minor_changes:
        - >-
          playbooks/run-ansible — auto-install the local
          sbates130272.batesste collection when missing.
          Set FORCE_LOCAL=1 to rebuild and reinstall from
          the checkout before each run.
      bugfixes:
        - >-
          uprof_setup — resolve AMDuProfCLI from the
          amduprof package under /opt/AMDuProf_* and add
          a symbolic link in /usr/local/bin; the .deb
          does not add the CLI to PATH.
  1.0.0:
    release_date: "2026-03-19"
    changes:
      release_summary: >-
        Initial release of the batesste Ansible
        collection. All roles previously published as
        standalone roles are now bundled into a single
        collection. The geerlingguy.docker and
        mrlesmithjr.netplan dependencies have been
        inlined.
      major_changes:
        - >-
          Published 20 roles as the
          ``sbates130272.batesste`` collection.
        - >-
          Added ``docker_setup`` role replacing the
          standalone ``geerlingguy.docker`` role.
        - >-
          Inlined netplan bridge configuration into
          ``qemu_setup``, removing the
          ``mrlesmithjr.netplan`` dependency.
        - >-
          Standardised all role metadata to use
          Apache-2.0 license.
        - >-
          All inter-role references now use fully
          qualified collection names (FQCN).
