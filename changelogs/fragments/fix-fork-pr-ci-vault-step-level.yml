trivial:
  - >-
    CI: the mutt_setup-test and build-spellcheck-lint-test checks kept
    failing on fork PRs even after ``continue-on-error`` was added, because
    it was set at the *job* level. A job-level ``continue-on-error: true``
    only changes the overall workflow run's conclusion to success; the
    individual job's own check run (what shows up in the PR checks list and
    what branch protection evaluates) still reports failure. Move it to the
    specific step that decrypts the real ansible-vault secret instead, for
    mutt_setup's own CI and for the equivalent step in the main
    batesste-ansible-ci.yml workflow (which also runs mutt_setup by way of
    the ``newmachine`` recipe). Applied the same step-level fix to
    nvmeof_setup and nfs_rdma_setup for consistency, since they used the
    same now-incorrect job-level pattern.
