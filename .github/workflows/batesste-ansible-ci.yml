# Main CI workflow for batesste-ansible repository
#
# This workflow runs linting, spelling checks, and core playbook tests.
# Individual role tests are in separate auto-generated workflow files.
# See .github/README.md for details on the automated workflow system.

name: batesste-ansible - CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'playbooks/**'
      - 'roles/**'
      - 'README.md'
      - '.github/check-readme.sh'
      - '.github/workflows/batesste-ansible-ci.yml'
      - '.ansible-lint'
      - '.codespellrc'
      - 'requirements.txt'
      - 'requirements.yml'
      - '.github/generate-workflows.py'

jobs:
  vault-tests-skipped-notice:
    name: Vault tests skipped (fork PR)
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.actor == 'dependabot[bot]')
    steps:
      - name: Explain why vault tests did not run
        run: |
          echo "::notice::Vault-dependent tests are skipped for fork PRs because"
          echo "::notice::GitHub does not share repository secrets with forks."
          echo "::notice::A maintainer will re-run these tests after merging."

  check-generated-workflows:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Setup python and pip
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Regenerate workflow files
        run: python3 .github/generate-workflows.py
      - name: Fail if generated files differ from committed files
        run: |
          if ! git diff --exit-code .github/workflows/; then
            echo "Workflow files are out of sync with generate-workflows.py."
            echo "Run: python3 .github/generate-workflows.py"
            exit 1
          fi

  build-spellcheck-lint-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Setup python and pip
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - name: Install pip packages
        run: python3 -m pip install -r requirements.txt
      - name: Spell check with codespell
        uses: codespell-project/actions-codespell@v2
      - name: Render the checkout directory safe for the lint step
        run: git config --global --add safe.directory /github/workspace
      - name: Run ansible-galaxy to install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Build and install the collection locally
        run: |
          ansible-galaxy collection build --force
          ansible-galaxy collection install sbates130272-batesste-*.tar.gz --force
      - name: Create fake vault-password for CI
        run: |
          echo "ci-dummy" > playbooks/vault-password
          echo "ci-dummy" > playbooks/sudo-password

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.10.1
        with:
          args: "-c .ansible-lint"
          setup_python: "false"
      - name: Create an SSH keypair
        run: mkdir -p .ssh && ssh-keygen -b 2048 -t rsa -f ~/.ssh/id_rsa -q -N ""
      - name: Create a GNU PGP folder
        run: mkdir -p .gnupg
      - name: Write hosts-ci file
        uses: DamianReeves/write-file-action@v1.3
        with:
          path: ./playbooks/hosts-ci
          write-mode: overwrite
          contents: |
            [locals]
            [runners]
            localhost root_user=runner username=runner ansible_connection=local
            [awsmachines]
            [localvms]
      - name: Check README references all roles
        run: bash .github/check-readme.sh

      - name: Run the default playbook against the local runner
        # Skipped for fork PRs and dependabot: GitHub withholds repo secrets from those runs.
        if: >-
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
          github.actor != 'dependabot[bot]'
        run: |
          ansible-playbook ${PLAYBOOK} -v -i ${HOSTS} \
            --vault-password-file <(printf '%s\n' "$ANSIBLE_VAULT_PASSWORD") \
            -e "targets=${TARGETS}" \
            -e "setup_recipe=${RECIPE}" \
            -e "{ 'consul_setup_start_service': false }" \
            -e "git_setup_user_name=CI Runner" \
            -e "git_setup_user_email=runner@ci.local" \
            -e "{ 'git_setup_enable_gpg_signing': false, 'git_setup_gh_authenticate': false, 'git_setup_dotfiles_enable': false }"
        env:
          PLAYBOOK: playbooks/setup/setup.yml
          RECIPE: setup-default
          TARGETS: runners
          HOSTS: playbooks/hosts-ci
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Run the setup-amd recipe (software roles only, no hardware)
        # Exercises the setup-amd recipe dispatcher with roles that run safely
        # on a CI runner. Hardware-gated roles (rdma_setup, rocm_setup,
        # uprof_setup) are excluded via setup_roles override.
        # Skipped for fork PRs and dependabot: GitHub withholds repo secrets from those runs.
        if: >-
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
          github.actor != 'dependabot[bot]'
        run: |
          ansible-playbook ${PLAYBOOK} -v -i ${HOSTS} \
            --vault-password-file <(printf '%s\n' "$ANSIBLE_VAULT_PASSWORD") \
            -e "targets=${TARGETS}" \
            -e "setup_recipe=${RECIPE}" \
            -e "setup_roles=user_setup,fave_packages,git_setup,claude_setup" \
            -e "{ 'user_setup_unprivileged': true, 'user_setup_dotfiles_enable': false, 'git_setup_enable_gpg_signing': false, 'git_setup_gh_authenticate': false, 'git_setup_dotfiles_enable': false }" \
            -e "git_setup_user_name=CI Runner" \
            -e "git_setup_user_email=runner@ci.local" \
            -e "vault_claude_setup_api_key=test_ci_api_key_placeholder" \
            -e "claude_setup_proxy_upstream=http://localhost:8000"
        env:
          PLAYBOOK: playbooks/setup/setup.yml
          RECIPE: setup-amd
          TARGETS: runners
          HOSTS: playbooks/hosts-ci
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
