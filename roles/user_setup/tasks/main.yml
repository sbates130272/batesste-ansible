---
# Copyright (c) Stephen Bates, 2022
#
# Create the user and make them a sudoer. Also copy in the SSH
# key file so one can use it inside the new machine. Also make sure
# one is a password-less sudo so we can execute other roles as
# myself.

- name: Set a fact containing the current roles' path
  ansible.builtin.set_fact:
    user_setup_calling_role_path_fact: "{{ role_path }}"

- name: Test the host platform to see if it can support this role
  ansible.builtin.include_role:
    name: sbates130272.batesste.check_platform
  vars:
    calling_role_path: "{{ user_setup_calling_role_path_fact }}"  # noqa var-naming

- name: Ensure the user and admin groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - users
    - admin
  become: true
  when: not user_setup_unprivileged | default(false)

- name: Create (or update) an account for the specified user
  ansible.builtin.user:
    name: "{{ username }}"
    groups: users,admin
    append: true
    state: present
    shell: /bin/bash
  become: true
  register: user_setup_user_result
  when: not user_setup_unprivileged | default(false)

- name: Set target user home directory fact
  ansible.builtin.set_fact:
    user_setup_home: "{{ user_setup_user_result.home }}"
  when: not user_setup_unprivileged | default(false)

- name: Set user home fact from environment (unprivileged fallback)
  ansible.builtin.set_fact:
    user_setup_home: "{{ ansible_env.HOME }}"
  when: user_setup_unprivileged | default(false)

- name: Set authorized key for the user from local file
  ansible.posix.authorized_key:
    user: "{{ username }}"
    state: present
    key: "{{ lookup('file', user_setup_ssh_key_src_dir ~ '/' ~ user_setup_ssh_key_name ~ '.pub') }}"

- name: Set user as passwordless sudoer
  ansible.builtin.blockinfile:
    path: /etc/sudoers.d/10-ansible-added-users
    owner: root
    group: root
    state: present
    create: true
    mode: "0644"
    block: |
      # Added by Ansible
      {{ username }} ALL=(ALL) NOPASSWD:ALL
  become: true
  when: not user_setup_unprivileged | default(false)

- name: Copy SSH private key
  ansible.builtin.copy:
    force: true
    src: "{{ user_setup_ssh_key_src_dir }}/{{ user_setup_ssh_key_name }}"
    dest: "{{ user_setup_home }}/.ssh/{{ user_setup_ssh_key_name }}"
    mode: "0600"

- name: Copy SSH public key
  ansible.builtin.copy:
    force: true
    src: "{{ user_setup_ssh_key_src_dir }}/{{ user_setup_ssh_key_name }}.pub"
    dest: "{{ user_setup_home }}/.ssh/{{ user_setup_ssh_key_name }}.pub"
    mode: "0644"

- name: Ensure users can access dmesg without sudo # noqa: args[module]
  ansible.builtin.blockinfile:
    path: /etc/sysctl.d/10-kernel-hardening.conf
    state: present
    create: false
    marker_begin: BEGIN (user-setup)
    marker_end: END (user-setup)
    block: |
      kernel.dmesg_restrict = 0
  become: true
  when: not user_setup_unprivileged | default(false)

- name: Restart procps service so dmesg rule takes effect # noqa: args[module]
  ansible.builtin.service:
    service: procps
    state: restarted
  become: true
  when: not user_setup_unprivileged | default(false)

- name: Massively improve startup on certain systems
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/systemd-networkd-wait-online.service
    search_string: ExecStart
    line: ExecStart=/lib/systemd/systemd-networkd-wait-online --any
  become: true
  when: not user_setup_unprivileged | default(false)

- name: Restart service # noqa: args[module]
  ansible.builtin.service:
    service: network-online.target
    state: restarted
  become: true
  when: not user_setup_unprivileged | default(false)

- name: Ensure package install is non-interactive
  ansible.builtin.blockinfile:
    path: "{{ user_setup_home }}/.bashrc"
    state: present
    marker_begin: BEGIN (user_setup)
    marker_end: END (user_setup)
    block: |
      export DEBIAN_FRONTEND=noninteractive

- name: Exec preferred shell for interactive logins (tcsh guard)
  ansible.builtin.blockinfile:
    path: "{{ user_setup_home }}/.tcshrc"
    state: present
    create: true
    mode: "0644"
    marker_begin: "# BEGIN (user_setup)"
    marker_end: "# END (user_setup)"
    block: |
      if ($?prompt) exec {{ user_setup_preferred_shell }} --login
  when: user_setup_preferred_shell | length > 0

- name: Set the timezone of the system clock
  community.general.timezone:
    name: "{{ user_setup_timezone }}"
  become: true
  when: not user_setup_unprivileged | default(false)

- name: Ensure SSH config file exists for user and create a Host * when absent
  ansible.builtin.lineinfile:
    path: "{{ user_setup_home }}/.ssh/config"
    line: Host *
    state: present
    create: true
    mode: "0644"

- name: Set important values in user's ssh config file
  ansible.builtin.lineinfile:
    path: "{{ user_setup_home }}/.ssh/config"
    line: "{{ item }}"
    insertafter: Host *
    state: present
    create: false
  loop:
    - ServerAliveInterval 60
    - ServerAliveCountMax 30
    - StrictHostKeyChecking accept-new

- name: Ensure .emacs.d folder exists
  ansible.builtin.file:
    path: "{{ user_setup_home }}/.emacs.d"
    state: directory
    mode: "0755"

- name: Copy emacs config file from our files folder
  ansible.builtin.copy:
    force: true
    src: init.el
    dest: "{{ user_setup_home }}/.emacs.d/init.el"
    mode: "0644"

- name: Copy emacs config file from our files folder
  ansible.builtin.copy:
    force: true
    src: .emacs
    dest: "{{ user_setup_home }}/.emacs"
    mode: "0644"

- name: Check if Projects is already a mount point
  ansible.builtin.command:
    cmd: mountpoint -q {{ user_setup_home }}/Projects
  register: user_setup_projects_mountpoint
  changed_when: false
  failed_when: false
  when: user_setup_vm_fstab

- name: Create Projects folder if it does not exist
  ansible.builtin.file:
    path: "{{ user_setup_home }}/Projects"
    state: directory
    owner: "{{ username }}"
    mode: "0755"
  become: true
  when:
    - user_setup_vm_fstab
    - not user_setup_unprivileged | default(false)
    - user_setup_projects_mountpoint.rc != 0

- name: Add an entry in fstab for VM virtio-fs
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "hostfs {{ user_setup_home }}/Projects 9p trans=virtio,version=9p2000.L,nofail 0 1"
    state: present
  become: true
  when:
    - user_setup_vm_fstab
    - not user_setup_unprivileged | default(false)

- name: Perform a systemctl daemon-reload and start of mount
  ansible.builtin.service:
    name: home-{{ username }}-Projects.mount
    state: started
    daemon_reload: true
  become: true
  register: user_setup_mount_start_result
  failed_when:
    - user_setup_mount_start_result is failed
    - "'already active' not in (user_setup_mount_start_result.msg | default('') | lower)"
    - "'not found' not in (user_setup_mount_start_result.msg | default('') | lower)"
  when:
    - user_setup_vm_fstab
    - not user_setup_unprivileged | default(false)

- name: Install driverctl for MOTD driver overrides display
  ansible.builtin.package:
    name: driverctl
    state: present
  become: true
  when:
    - user_setup_motd
    - not user_setup_unprivileged | default(false)

- name: Copy driver overrides MOTD script
  ansible.builtin.copy:
    src: 99-driver-overrides
    dest: /etc/update-motd.d/99-driver-overrides
    owner: root
    group: root
    mode: '0755'
  become: true
  when:
    - user_setup_motd
    - not user_setup_unprivileged | default(false)
