# the default user is batesste
username: batesste
user_setup_timezone: America/Edmonton

# Do we want to fstab in a VM
user_setup_vm_fstab: false

# Enable MOTD showing driver overrides
user_setup_motd: false

# SSH key filename stem (e.g. id_rsa, id_ed25519)
user_setup_ssh_key_name: id_rsa

# Controller-side directory containing the SSH keys
user_setup_ssh_key_src_dir: "{{ lookup('env', 'HOME') }}/.ssh"

# Set to true to skip tasks that require root/sudo (user/group creation, SSH key
# deployment, sudoers, sysctl, timezone, networking, fstab, MOTD). User-space
# config (.bashrc, ~/.ssh/config, emacs files) still runs.
user_setup_unprivileged: false

# Set to the path of the preferred shell to exec into for interactive sessions
# when the login shell is not bash (e.g. tcsh on AMD systems). Empty to disable.
# Uses $?prompt guard so non-interactive SSH (Ansible, scp) is unaffected.
user_setup_preferred_shell: ""

# GPG private key — armored export stored in vault; imported before git-crypt unlock.
# Obtain with: gpg --armor --export-secret-keys <fingerprint>
# Store as vault_gpg_private_key and reference via inventory.
user_setup_gpg_private_key: ""

# Dotfiles integration — clone batesste-dotfiles and run install.sh
# When enabled, the dotfiles repo becomes the authoritative source for the stowed packages.
user_setup_dotfiles_enable: true
user_setup_dotfiles_repo: "https://github.com/sbates130272/batesste-dotfiles.git"
user_setup_dotfiles_version: "latest"
user_setup_dotfiles_dest: "{{ user_setup_home }}/.dotfiles"
# Space-separated list of stow packages passed to install.sh
user_setup_dotfiles_packages: "bash git gh"
# Per-package skip flags — set true when that stow package owns the config.
# Derived from dotfiles_packages by default; override explicitly if needed.
user_setup_dotfiles_owns_emacs: false
user_setup_dotfiles_owns_ssh: false
user_setup_dotfiles_owns_hf: false
user_setup_dotfiles_owns_claude: false

# Path to the CA bundle for git HTTPS clones. Set GIT_SSL_CAINFO explicitly so
# git's libcurl finds the system bundle (populated by update-ca-certificates with
# the ZScaler cert during cloud-init). Harmless on non-ZScaler systems.
user_setup_git_ssl_cainfo: /etc/ssl/certs/ca-certificates.crt

# Set true on AMD corporate hosts to deploy amd-root-ca.crt and run
# update-ca-certificates before the dotfiles git clone.
user_setup_install_amd_ca: false

# HuggingFace token — no longer written by this role. When dotfiles is enabled with the
# secrets package, HF_TOKEN is delivered via ~/.secrets.env (git-crypt encrypted in dotfiles).
