---
# Copyright (c) Stephen Bates, 2022
#
# AMD ROCm software install and setup.

- name: Set a fact containing the current roles' path
  ansible.builtin.set_fact:
    rocm_setup_calling_role_path_fact: "{{ role_path }}"

- name: Test the host platform to see if it can support this role
  ansible.builtin.include_role:
    name: sbates130272.batesste.check_platform
  vars:
    calling_role_path: "{{ rocm_setup_calling_role_path_fact }}"  # noqa var-naming

- name: Resolve WSL install mode
  ansible.builtin.set_fact:
    rocm_setup_wsl_mode: >-
      {{
        'legacy' if (rocm_setup_wsl_install | default(false)
                     and rocm_setup_wsl | default(false) in [false, none, ''])
        else rocm_setup_wsl | default(false)
      }}
    rocm_setup_wsl_enabled: "{{
        ('legacy' if (rocm_setup_wsl_install | default(false)
                       and rocm_setup_wsl | default(false) in [false, none, ''])
         else rocm_setup_wsl | default(false)) in ['legacy', 'rocdxg']
      }}"

- name: Run the rocm_setup prerequisite steps
  ansible.builtin.import_tasks:
    file: rocm_pre.yml

- name: Fail early when legacy stream is requested on resolute (26.04)
  ansible.builtin.fail:
    msg: >-
      repo.radeon.com (legacy stream) does not publish a resolute (Ubuntu 26.04)
      repository. Use rocm_setup_repo_stream: therock for Ubuntu 26.04 support.
  when:
    - rocm_setup_repo_stream != 'therock'
    - ansible_facts['distribution_release'] == 'resolute'

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Download ROCm GPG key (legacy stream — repo.radeon.com)
  ansible.builtin.get_url:
    url: "https://{{ rocm_setup_repo_base_url }}/rocm/rocm.gpg.key"
    dest: /etc/apt/keyrings/rocm.gpg.key
    mode: "0644"
  become: true
  when: rocm_setup_repo_stream != 'therock'

- name: Dearmor ROCm GPG key (legacy stream)
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/rocm.gpg /etc/apt/keyrings/rocm.gpg.key
    creates: /etc/apt/keyrings/rocm.gpg
  become: true
  when: rocm_setup_repo_stream != 'therock'

- name: Download ROCm GPG key (therock stream — repo.amd.com)
  ansible.builtin.get_url:
    url: "{{ rocm_setup_therock_gpg_url }}"
    dest: "{{ rocm_setup_therock_keyring_path }}.key"
    mode: "0644"
  become: true
  when: rocm_setup_repo_stream == 'therock'

- name: Dearmor ROCm GPG key (therock stream)
  ansible.builtin.command:
    cmd: >-
      gpg --dearmor -o {{ rocm_setup_therock_keyring_path }}
      {{ rocm_setup_therock_keyring_path }}.key
    creates: "{{ rocm_setup_therock_keyring_path }}"
  become: true
  when: rocm_setup_repo_stream == 'therock'

# The AMDGPU kernel driver repo (repo.radeon.com/amdgpu/) uses the same GPG
# key as the legacy ROCm stream.  When running the therock stream with kernel
# driver installation, we need rocm.gpg present even though the therock ROCm
# userspace repo uses amdrocm.gpg.
- name: Download repo.radeon.com GPG key for therock (kernel driver or metrics exporter)
  ansible.builtin.get_url:
    url: "https://{{ rocm_setup_repo_base_url }}/rocm/rocm.gpg.key"
    dest: /etc/apt/keyrings/rocm.gpg.key
    mode: "0644"
  become: true
  when:
    - rocm_setup_repo_stream == 'therock'
    - rocm_setup_install_kernel_driver or rocm_setup_install_metrics_exporter

- name: Dearmor repo.radeon.com GPG key for therock
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/rocm.gpg /etc/apt/keyrings/rocm.gpg.key
    creates: /etc/apt/keyrings/rocm.gpg
  become: true
  when:
    - rocm_setup_repo_stream == 'therock'
    - rocm_setup_install_kernel_driver or rocm_setup_install_metrics_exporter

- name: Write ROCm sources file
  ansible.builtin.template:
    src: rocm.sources.j2
    dest: "{{ rocm_setup_sources_file }}"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Create APT pin file for legacy stream
  ansible.builtin.copy:
    content: |
      Package: *
      Pin: release o={{ rocm_setup_repo_pin_origin }}
      Pin-Priority: 600
    dest: /etc/apt/preferences.d/rocm-pin-600
    owner: root
    group: root
    mode: '0644'
  become: true
  when: rocm_setup_repo_stream != 'therock'

# Deliberately unconditional: this directly follows writing rocm.sources, and
# apt decides cache freshness purely on the update-success-stamp mtime, which
# a sources file rewrite never touches. A cache_valid_time here would silently
# skip fetching the just-added repo's metadata.
- name: Update apt cache after ROCm repos
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Resolve ROCm meta package name (legacy stream)
  ansible.builtin.set_fact:
    rocm_setup_rocm_meta_pkg: >-
      {{
        rocm_setup_versioned_package_map.get(
          rocm_setup_rocm_version | string | trim,
          'rocm'
        )
      }}
  when: rocm_setup_repo_stream != 'therock'

- name: Resolve ROCm meta package name (therock stream)
  ansible.builtin.set_fact:
    rocm_setup_rocm_meta_pkg: amdrocm
  when: rocm_setup_repo_stream == 'therock'

- name: Build ROCm package list
  ansible.builtin.set_fact:
    rocm_setup_packages: >-
      {{
        (rocm_setup_minimal_packages
         if (rocm_setup_minimal | bool
             and rocm_setup_repo_stream == 'therock'
             and rocm_setup_wsl_mode in [false, 'rocdxg'])
         else
           ['libstdc++-14-dev']
           + ([rocm_setup_rocm_meta_pkg]
              if rocm_setup_wsl_mode in [false, 'rocdxg'] else [])
           + (['hsa-runtime-rocr4wsl-amdgpu', 'rocm-core', 'rocm-dev']
              if rocm_setup_wsl_mode == 'legacy' else [])
           + (['amdrocm-runtime-dev']
              if rocm_setup_repo_stream == 'therock'
                 and rocm_setup_wsl_mode != 'legacy' else [])
        )
      }}

- name: Find competing-stream ROCm packages to purge
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      apt list --installed 2>/dev/null |
      grep -E '{{ rocm_setup_therock_package_pattern
                  if rocm_setup_repo_stream != "therock"
                  else rocm_setup_legacy_package_pattern }}' |
      cut -d/ -f1 || true
    executable: /bin/bash
  register: rocm_setup_other_stream_installed
  changed_when: false
  become: true
  when: rocm_setup_purge_other_stream | bool

- name: Purge competing-stream ROCm packages
  ansible.builtin.apt:
    name: "{{ rocm_setup_other_stream_installed.stdout_lines }}"
    state: absent
    purge: true
    autoremove: true
  become: true
  when:
    - rocm_setup_purge_other_stream | bool
    - rocm_setup_other_stream_installed.stdout_lines | default([]) | length > 0

- name: Install ROCm packages
  ansible.builtin.package:
    update_cache: true
    cache_valid_time: "{{ rocm_setup_apt_cache_valid_time }}"
    name: "{{ rocm_setup_packages }}"
  become: true
  when: rocm_setup_packages | length > 0

- name: Discover therock versioned install prefix
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ls -d /opt/rocm/core-* 2>/dev/null | sort -V | tail -1 || true
    executable: /bin/bash
  register: rocm_setup_therock_prefix_raw
  changed_when: false
  when: rocm_setup_repo_stream == 'therock'

- name: Set therock install prefix fact
  ansible.builtin.set_fact:
    rocm_setup_therock_prefix: "{{ rocm_setup_therock_prefix_raw.stdout | trim }}"
  when:
    - rocm_setup_repo_stream == 'therock'
    - rocm_setup_therock_prefix_raw.stdout | default('') | trim | length > 0

- name: Update the library linker with rocm library paths
  ansible.builtin.copy:
    content: >-
      {{
        ((['/opt/rocm/lib'] if rocm_setup_repo_stream != 'therock' else [])
         + (['/opt/rocm/lib64'] if rocm_setup_wsl_mode == 'rocdxg' else [])
         + ([rocm_setup_therock_prefix + '/lib']
            if rocm_setup_repo_stream == 'therock' and rocm_setup_therock_prefix is defined
            else []))
        | join('\n') + '\n'
      }}
    dest: /etc/ld.so.conf.d/rocm.conf
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Run ldconfig to ensure library updates take effect
  ansible.builtin.command:
    cmd: ldconfig
  become: true
  changed_when: false

- name: Write /etc/profile.d/rocm.sh with therock PATH and LD_LIBRARY_PATH
  ansible.builtin.template:
    src: rocm-profile.sh.j2
    dest: /etc/profile.d/rocm.sh
    owner: root
    group: root
    mode: '0644'
  become: true
  when: rocm_setup_repo_stream == 'therock'

- name: Update the PCIe ID tables (for new GPU support)
  ansible.builtin.command:
    cmd: update-pciids
  become: true
  failed_when: false
  changed_when: false
  when: rocm_setup_update_pciids | default(false)

- name: Install extra kernel-related packages (e.g. linux-modules-extra-aws)
  ansible.builtin.package:
    name: "{{ rocm_setup_extra_kernel_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ rocm_setup_apt_cache_valid_time }}"
  when: rocm_setup_extra_kernel_packages | default([]) | length > 0
  become: true
  register: rocm_setup_extra_kernel_install

- name: Create /etc/dkms directory for defer-build marker
  ansible.builtin.file:
    path: /etc/dkms
    state: directory
    mode: '0755'
  become: true
  when:
    - not rocm_setup_wsl_enabled
    - rocm_setup_install_kernel_driver
    - rocm_setup_amdgpu_dkms_defer_build | bool

- name: Place /etc/dkms/no-autoinstall marker
  ansible.builtin.copy:
    content: ""
    dest: /etc/dkms/no-autoinstall
    force: false
    mode: '0644'
  become: true
  when:
    - not rocm_setup_wsl_enabled
    - rocm_setup_install_kernel_driver
    - rocm_setup_amdgpu_dkms_defer_build | bool

- name: Check whether update-initramfs is already diverted
  ansible.builtin.command:  # noqa command-instead-of-module
    cmd: dpkg-divert --list /usr/sbin/update-initramfs
  register: rocm_setup_divert_check
  changed_when: false
  become: true
  when:
    - not rocm_setup_wsl_enabled
    - rocm_setup_install_kernel_driver
    - rocm_setup_amdgpu_dkms_defer_build | bool

- name: Divert /usr/sbin/update-initramfs to a no-op for deferred amdgpu-dkms install
  ansible.builtin.command:  # noqa command-instead-of-module
    cmd: dpkg-divert --add --rename --divert /usr/sbin/update-initramfs.distrib /usr/sbin/update-initramfs
  changed_when: true
  become: true
  when:
    - not rocm_setup_wsl_enabled
    - rocm_setup_install_kernel_driver
    - rocm_setup_amdgpu_dkms_defer_build | bool
    - (rocm_setup_divert_check.stdout | default('')) == ""

- name: Place no-op /usr/sbin/update-initramfs for deferred amdgpu-dkms install
  ansible.builtin.copy:
    content: "#!/bin/sh\nexit 0\n"
    dest: /usr/sbin/update-initramfs
    mode: '0755'
    owner: root
    group: root
  become: true
  when:
    - not rocm_setup_wsl_enabled
    - rocm_setup_install_kernel_driver
    - rocm_setup_amdgpu_dkms_defer_build | bool
    - (rocm_setup_divert_check.stdout | default('')) == ""

- name: Install or upgrade amdgpu-dkms to latest available  # noqa package-latest
  ansible.builtin.package:
    update_cache: true
    cache_valid_time: "{{ rocm_setup_apt_cache_valid_time }}"
    name:
      - amdgpu-dkms
    state: latest
  when:
    - not rocm_setup_wsl_enabled
    - rocm_setup_install_kernel_driver
  become: true
  register: rocm_setup_amdgpu_dkms_install
  # Using latest is intentional: When installing multiple ROCm versions,
  # only one amdgpu-dkms can be installed and it must be the latest

- name: Display amdgpu-dkms version installed
  ansible.builtin.debug:
    msg: "amdgpu-dkms has been installed/upgraded"
  when: not rocm_setup_wsl_enabled and rocm_setup_amdgpu_dkms_install.changed

- name: Perform a reboot to allow changes to take effect
  ansible.builtin.reboot:
    reboot_timeout: "{{ rocm_setup_reboot_timeout }}"
  become: true
  when:
    - ansible_connection != 'local'
    - not rocm_setup_wsl_enabled
    - not rocm_setup_skip_reboot

- name: Install ROCDXG WSL bridge and environment
  ansible.builtin.import_tasks:
    file: rocm_rocdxg.yml
  when: rocm_setup_wsl_mode == 'rocdxg'

- name: Run the rocm checks to ensure install worked
  ansible.builtin.import_tasks:
    file: rocm_check.yml
  when: rocm_setup_run_gpu_checks | bool

- name: Install and configure AMD Device Metrics Exporter
  ansible.builtin.import_tasks:
    file: metrics_exporter.yml
  when: rocm_setup_install_metrics_exporter

- name: Install xrocmtop AMD GPU monitoring tool
  ansible.builtin.import_tasks:
    file: xrocmtop.yml
  when:
    - rocm_setup_install_xrocmtop
    - not rocm_setup_wsl_enabled

- name: Install hipFile and fio-libhipfile
  ansible.builtin.import_tasks:
    file: hipfile.yml
  when:
    - rocm_setup_install_hipfile
    - not rocm_setup_wsl_enabled

- name: Install ROCm-CLI for user
  ansible.builtin.import_tasks:
    file: rocm_cli.yml
  when: rocm_setup_install_rocm_cli

- name: Build, install and test rocm-xio
  ansible.builtin.import_tasks:
    file: rocm_xio.yml
  when: rocm_setup_install_xio | bool
