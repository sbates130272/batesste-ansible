---
# ROCDXG (librocdxg) setup for WSL2 HIP compute.

- name: Assert /dev/dxg is present for ROCDXG
  ansible.builtin.stat:
    path: /dev/dxg
  register: rocm_setup_wsl_dxg_device

- name: Fail when /dev/dxg is missing
  ansible.builtin.fail:
    msg: >-
      /dev/dxg is not available. Install Adrenalin 26.2.2+ on Windows and
      ensure WSL2 GPU support is enabled before using rocm_setup_wsl: rocdxg.
  when: not rocm_setup_wsl_dxg_device.stat.exists

- name: Assert libdxcore.so is present for ROCDXG
  ansible.builtin.stat:
    path: /usr/lib/wsl/lib/libdxcore.so
  register: rocm_setup_wsl_libdxcore

- name: Fail when libdxcore.so is missing
  ansible.builtin.fail:
    msg: >-
      /usr/lib/wsl/lib/libdxcore.so is not available. This host does not
      appear to be a WSL2 environment with DXCore GPU support.
  when: not rocm_setup_wsl_libdxcore.stat.exists

- name: Check whether Windows SDK include path is already present
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for base in \
        "/mnt/c/Program Files (x86)/Windows Kits/10/Include" \
        "/mnt/c/Program Files/Windows Kits/10/Include"; do
        if [ -d "$base" ]; then
          find "$base" -maxdepth 1 -type d -name '10.0.*' 2>/dev/null
        fi
      done | sort -V | tail -n 1
    executable: /bin/bash
  register: rocm_setup_wsl_win_sdk_precheck
  changed_when: false
  when: rocm_setup_wsl_win_sdk_path | default('') | length == 0

- name: Install Windows SDK on the Windows host via winget
  ansible.builtin.command:
    argv:
      - powershell.exe
      - -NoProfile
      - -NonInteractive
      - -Command
      - >-
        winget install --id {{ rocm_setup_wsl_win_sdk_winget_id }}
        --accept-package-agreements --accept-source-agreements
        --disable-interactivity
  register: rocm_setup_wsl_win_sdk_winget
  changed_when: >-
    'Successfully installed' in (rocm_setup_wsl_win_sdk_winget.stdout | default(''))
    or 'Successfully installed' in (rocm_setup_wsl_win_sdk_winget.stderr | default(''))
  failed_when: false
  when:
    - rocm_setup_wsl_install_win_sdk | default(true)
    - rocm_setup_wsl_win_sdk_path | default('') | length == 0
    - rocm_setup_wsl_win_sdk_precheck.stdout | trim | length == 0

- name: Report Windows SDK winget install result
  ansible.builtin.debug:
    msg: >-
      winget install {{ rocm_setup_wsl_win_sdk_winget_id }}:
      {{ rocm_setup_wsl_win_sdk_winget.stdout | default('') }}
      {{ rocm_setup_wsl_win_sdk_winget.stderr | default('') }}
  when:
    - rocm_setup_wsl_win_sdk_winget is defined
    - not rocm_setup_wsl_win_sdk_winget.skipped | default(false)
    - rocm_setup_wsl_win_sdk_winget is changed
      or (rocm_setup_wsl_win_sdk_winget.rc | default(0)) != 0

- name: Search for Windows SDK include path
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for base in \
        "/mnt/c/Program Files (x86)/Windows Kits/10/Include" \
        "/mnt/c/Program Files/Windows Kits/10/Include"; do
        if [ -d "$base" ]; then
          find "$base" -maxdepth 1 -type d -name '10.0.*' 2>/dev/null
        fi
      done | sort -V | tail -n 1
    executable: /bin/bash
  register: rocm_setup_wsl_win_sdk_shell
  changed_when: false
  when: rocm_setup_wsl_win_sdk_path | default('') | length == 0

- name: Set Windows SDK include path from search
  ansible.builtin.set_fact:
    rocm_setup_wsl_win_sdk_include: "{{ rocm_setup_wsl_win_sdk_shell.stdout | trim }}"
  when: rocm_setup_wsl_win_sdk_path | default('') | length == 0

- name: Use configured Windows SDK include path
  ansible.builtin.set_fact:
    rocm_setup_wsl_win_sdk_include: "{{ rocm_setup_wsl_win_sdk_path | trim }}"
  when: rocm_setup_wsl_win_sdk_path | default('') | length > 0

- name: Fail when Windows SDK include path is not found
  ansible.builtin.fail:
    msg: >-
      Windows SDK include path not found under /mnt/c/Program Files/Windows
      Kits/10/Include or /mnt/c/Program Files (x86)/Windows Kits/10/Include.
      Install the SDK on the Windows host (elevated PowerShell):
      winget install {{ rocm_setup_wsl_win_sdk_winget_id }}
      --accept-package-agreements --accept-source-agreements
      Or download from https://developer.microsoft.com/windows/downloads/windows-sdk/
      Then re-run the playbook, or set rocm_setup_wsl_win_sdk_path in inventory
      to the Include/10.0.x.x directory. Set
      rocm_setup_wsl_install_win_sdk: false to skip automatic winget install.
  when: rocm_setup_wsl_win_sdk_include | default('') | length == 0

- name: Install librocdxg build dependencies
  ansible.builtin.package:
    name:
      - build-essential
      - cmake
      - git
    state: present
    update_cache: true
    cache_valid_time: "{{ rocm_setup_apt_cache_valid_time }}"
  become: true

- name: Check if librocdxg is already installed
  ansible.builtin.find:
    paths:
      - /opt/rocm/lib
      - /opt/rocm/lib64
    patterns:
      - librocdxg.so*
    file_type: file
  register: rocm_setup_wsl_librocdxg_find

- name: Set librocdxg installed fact
  ansible.builtin.set_fact:
    rocm_setup_wsl_librocdxg_installed: >-
      {{ (rocm_setup_wsl_librocdxg_find.files | default([]) | length) > 0 }}

- name: Clone librocdxg repository
  ansible.builtin.git:
    repo: "{{ rocm_setup_wsl_librocdxg_repo }}"
    dest: "{{ rocm_setup_wsl_librocdxg_src_dir }}"
    version: "{{ rocm_setup_wsl_librocdxg_version }}"
    force: "{{ rocm_setup_wsl_librocdxg_force }}"
  become: true
  when: >-
    rocm_setup_wsl_librocdxg_force
    or not rocm_setup_wsl_librocdxg_installed

- name: Remove stale librocdxg build directory
  ansible.builtin.file:
    path: "{{ rocm_setup_wsl_librocdxg_src_dir }}/build"
    state: absent
  become: true
  when: >-
    rocm_setup_wsl_librocdxg_force
    or not rocm_setup_wsl_librocdxg_installed

- name: Build and install librocdxg
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      set -e
      mkdir -p build
      cd build
      cmake .. -DWIN_SDK="{{ rocm_setup_wsl_win_sdk_include }}/shared"
      make -j"$(nproc)"
      make install
    chdir: "{{ rocm_setup_wsl_librocdxg_src_dir }}"
    executable: /bin/bash
  become: true
  register: rocm_setup_wsl_librocdxg_build
  changed_when: >-
    rocm_setup_wsl_librocdxg_force | bool
    or not rocm_setup_wsl_librocdxg_installed | bool
  when: >-
    rocm_setup_wsl_librocdxg_force
    or not rocm_setup_wsl_librocdxg_installed

- name: Verify librocdxg library was installed
  ansible.builtin.find:
    paths:
      - /opt/rocm/lib
      - /opt/rocm/lib64
    patterns:
      - librocdxg.so*
    file_type: file
  register: rocm_setup_wsl_librocdxg_verify

- name: Fail when librocdxg library is missing after build
  ansible.builtin.fail:
    msg: >-
      librocdxg build finished but no librocdxg.so was found under
      /opt/rocm/lib or /opt/rocm/lib64. Check build output in
      {{ rocm_setup_wsl_librocdxg_src_dir }}/build and re-run with
      rocm_setup_wsl_librocdxg_force: true.
  when: rocm_setup_wsl_librocdxg_verify.files | default([]) | length == 0

- name: Determine if HSA_ENABLE_DXG_DETECTION is required
  ansible.builtin.set_fact:
    rocm_setup_wsl_needs_dxg_detection: "{{ rocm_setup_wsl_hsa_enable_dxg_detection | bool }}"

- name: Install ROCDXG environment script system-wide
  ansible.builtin.template:
    src: rocm-wsl-env.sh.j2
    dest: /etc/profile.d/rocm-wsl-env.sh
    owner: root
    group: root
    mode: '0644'
  become: true

# --- gpuagent-wsl native binary ---
# ROCm/gpu-agent (merged PR #103) ships gpuagent-wsl: a dedicated binary that
# links directly against /opt/rocm-wsl/lib/libamd_smi.so at build time and
# has a built-in /dev/dxg guard, removing the need for an LD_PRELOAD shim.
#
# Deployment paths tried in order:
#   a) upstream apt package (rocm_setup_wsl_gpuagent_wsl_pkg) — preferred;
#      when found, warns that path (b) and its role code can be removed.
#   b) hosted .deb from sbates130272/batesste-ansible GitHub release —
#      current path until AMD publishes a package.

- name: Check whether upstream gpuagent-wsl apt package is available
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      apt-cache show {{ rocm_setup_wsl_gpuagent_wsl_pkg }} 2>/dev/null | grep -q '^Package:'
    executable: /bin/bash
  register: rocm_setup_wsl_gpuagent_pkg_check
  changed_when: false
  failed_when: false
  when: rocm_setup_install_metrics_exporter | bool

- name: Install gpuagent-wsl from upstream apt package
  ansible.builtin.package:
    name: "{{ rocm_setup_wsl_gpuagent_wsl_pkg }}"
    state: present
  become: true
  when:
    - rocm_setup_install_metrics_exporter | bool
    - rocm_setup_wsl_gpuagent_pkg_check.rc | default(1) == 0

- name: Warn that hosted .deb path can be removed
  ansible.builtin.debug:
    msg: >-
      {{ rocm_setup_wsl_gpuagent_wsl_pkg }} is now available as an upstream
      apt package. The hosted .deb path in rocm_setup/tasks/rocm_rocdxg.yml
      (tasks "Fetch/install gpuagent-wsl hosted .deb") and the asset at
      {{ rocm_setup_wsl_gpuagent_deb_repo }} releases/{{ rocm_setup_wsl_gpuagent_deb_tag }}
      can be removed once the upstream package is confirmed stable.
  when:
    - rocm_setup_install_metrics_exporter | bool
    - rocm_setup_wsl_gpuagent_pkg_check.rc | default(1) == 0

# --- hosted .deb fallback (path b) ---

- name: Check whether gpuagent-wsl is already installed
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      dpkg-query -W -f='${Status}' {{ rocm_setup_wsl_gpuagent_wsl_pkg }} 2>/dev/null | grep -q 'install ok installed'
    executable: /bin/bash
  register: rocm_setup_wsl_gpuagent_deb_installed
  changed_when: false
  failed_when: false
  when:
    - rocm_setup_install_metrics_exporter | bool
    - rocm_setup_wsl_gpuagent_pkg_check.rc | default(1) != 0

- name: Fetch gpuagent-wsl hosted .deb from GitHub release
  ansible.builtin.get_url:
    url: >-
      https://github.com/{{ rocm_setup_wsl_gpuagent_deb_repo }}/releases/download/{{ rocm_setup_wsl_gpuagent_deb_tag }}/{{ rocm_setup_wsl_gpuagent_deb_asset }}
    dest: "/tmp/{{ rocm_setup_wsl_gpuagent_deb_asset }}"
    headers:
      Authorization: >-
        {{ 'Bearer ' + rocm_setup_github_api_token if rocm_setup_github_api_token | length > 0 else omit }}
    mode: '0644'
  become: true
  when:
    - rocm_setup_install_metrics_exporter | bool
    - rocm_setup_wsl_gpuagent_pkg_check.rc | default(1) != 0
    - rocm_setup_wsl_gpuagent_deb_installed.rc | default(1) != 0

- name: Install gpuagent-wsl hosted .deb
  ansible.builtin.apt:
    deb: "/tmp/{{ rocm_setup_wsl_gpuagent_deb_asset }}"
  become: true
  when:
    - rocm_setup_install_metrics_exporter | bool
    - rocm_setup_wsl_gpuagent_pkg_check.rc | default(1) != 0
    - rocm_setup_wsl_gpuagent_deb_installed.rc | default(1) != 0

- name: Verify gpuagent-wsl binary is present
  ansible.builtin.stat:
    path: "{{ rocm_setup_wsl_gpuagent_wsl_bin_dir }}/gpuagent-wsl"
  register: rocm_setup_wsl_gpuagent_verify
  when: rocm_setup_install_metrics_exporter | bool

- name: Fail when gpuagent-wsl binary is missing after install
  ansible.builtin.fail:
    msg: >-
      gpuagent-wsl was not found at
      {{ rocm_setup_wsl_gpuagent_wsl_bin_dir }}/gpuagent-wsl after install.
      Check /tmp/{{ rocm_setup_wsl_gpuagent_deb_asset }} was downloaded and
      dpkg install succeeded. Re-run the playbook to retry.
  when:
    - rocm_setup_install_metrics_exporter | bool
    - not rocm_setup_wsl_gpuagent_verify.stat.exists

# --- point gpuagent.service at gpuagent-wsl via systemd drop-in ---
# The amdgpu-exporter debpkg ships gpuagent (bare-metal). Override ExecStart
# so the service runs gpuagent-wsl on WSL2 without patching LD_PRELOAD.

- name: Ensure gpuagent.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/gpuagent.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: rocm_setup_install_metrics_exporter | bool

- name: Install gpuagent.service WSL2 drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/gpuagent.service.d/wsl.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      ExecStart=
      ExecStart={{ rocm_setup_wsl_gpuagent_wsl_bin_dir }}/gpuagent-wsl
  become: true
  notify: Restart gpuagent
  when: rocm_setup_install_metrics_exporter | bool

- name: Remove LD_PRELOAD from gpuagent.conf if present
  ansible.builtin.lineinfile:
    path: /usr/local/etc/metrics/gpuagent.conf
    regexp: '^LD_PRELOAD='
    state: absent
  become: true
  notify: Restart gpuagent
  when: rocm_setup_install_metrics_exporter | bool

- name: Flush handlers after gpuagent-wsl changes
  ansible.builtin.meta: flush_handlers
  when: rocm_setup_install_metrics_exporter | bool
