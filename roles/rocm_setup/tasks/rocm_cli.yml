---
# Install ROCm-CLI for the configured user.
# https://github.com/ROCm/rocm-cli
# The installer downloads prebuilt binaries into ~/.local/bin and verifies
# their checksum and signature. Shell profile editing is disabled because
# hosts manage PATH through their own dotfiles.

- name: Ensure ROCm-CLI installer prerequisites are present
  ansible.builtin.package:
    name:
      - curl
      - openssl
      - tar
    state: present
  become: true

- name: Look up rocm_setup user home directory for ROCm-CLI
  ansible.builtin.getent:
    database: passwd
    key: "{{ rocm_setup_user }}"

- name: Set rocm_setup user home directory fact for ROCm-CLI
  ansible.builtin.set_fact:
    rocm_setup_rocm_cli_user_home: "{{ ansible_facts.getent_passwd[rocm_setup_user][4] }}"

- name: Ensure ~/.local/bin exists for user
  ansible.builtin.file:
    path: "{{ rocm_setup_rocm_cli_user_home }}/.local/bin"
    state: directory
    owner: "{{ rocm_setup_user }}"
    mode: '0755'
  become: true

# The installer has no up-to-date check and always reinstalls, so report a
# change only when the installed binaries actually differ afterwards.
- name: Run ROCm-CLI installer as user
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      rocm_bin="$HOME/.local/bin/rocm"
      before="$(cat "$rocm_bin" "${rocm_bin}d" 2>/dev/null | sha256sum | cut -d' ' -f1 || true)"
      curl -fsSL https://raw.githubusercontent.com/ROCm/rocm-cli/main/install.sh \
        | sh -s -- {{ rocm_setup_rocm_cli_channel | quote }}
      after="$(cat "$rocm_bin" "${rocm_bin}d" | sha256sum | cut -d' ' -f1)"
      if [ "$before" != "$after" ]; then echo ROCM_CLI_CHANGED; fi
    executable: /bin/bash
  become: true
  become_user: "{{ rocm_setup_user }}"
  environment:
    HOME: "{{ rocm_setup_rocm_cli_user_home }}"
    ROCM_CLI_UPDATE_SHELL_PATH: "0"
  register: rocm_setup_rocm_cli_install
  changed_when: "'ROCM_CLI_CHANGED' in rocm_setup_rocm_cli_install.stdout"

- name: Verify ROCm-CLI installation
  ansible.builtin.command:
    cmd: "{{ rocm_setup_rocm_cli_user_home }}/.local/bin/rocm --version"
  register: rocm_setup_rocm_cli_verify
  changed_when: false
  become: true
  become_user: "{{ rocm_setup_user }}"

- name: Display installed ROCm-CLI version
  ansible.builtin.debug:
    msg: "ROCm-CLI installed: {{ rocm_setup_rocm_cli_verify.stdout | trim }}"
