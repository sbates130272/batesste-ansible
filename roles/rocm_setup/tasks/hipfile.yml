# Install hipFile packages via apt (ROCm 7.14+).

- name: Set hipfile package list for therock stream
  ansible.builtin.set_fact:
    rocm_setup_hipfile_packages:
      - amdrocm-hipfile
      - amdrocm-hipfile-dev
  when:
    - rocm_setup_repo_stream == 'therock'
    - rocm_setup_hipfile_packages == ['hipfile']

- name: Install HIP runtime headers (required for hipfile dev on therock)
  ansible.builtin.package:
    name: "amdrocm-core-dev{{ rocm_setup_rocm_version | regex_search('^[0-9]+\\.[0-9]+') }}"
    state: present
  become: true
  when:
    - rocm_setup_repo_stream == 'therock'

- name: Install hipFile packages
  ansible.builtin.package:
    name: "{{ rocm_setup_hipfile_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ rocm_setup_apt_cache_valid_time }}"
  become: true

- name: Ensure fio-hipfile install directory exists
  ansible.builtin.file:
    path: "{{ rocm_setup_hipfile_fio_install_dir }}/bin"
    state: directory
    mode: "0755"
  become: true

- name: Check fio has libhipfile engine
  ansible.builtin.command:
    cmd: fio --enghelp=libhipfile
  register: rocm_setup_hipfile_fio_check
  changed_when: false
  failed_when: false
  when: rocm_setup_run_checks

- name: Show hipFile fio engine check output
  ansible.builtin.debug:
    msg: "fio libhipfile engine check rc={{ rocm_setup_hipfile_fio_check.rc | default('skipped') }}"
  when: rocm_setup_run_checks
