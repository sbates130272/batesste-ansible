- name: Check if wslinfo works for legacy WSL install
  ansible.builtin.command:
    cmd: wslinfo --version
  register: wslinfo
  changed_when: false
  failed_when: false
  when: rocm_setup_wsl_mode == 'legacy'

- name: Fail when wslinfo is unavailable for legacy WSL install
  ansible.builtin.fail:
    msg: |
      "wslinfo not working. Legacy WSL install requested. Aborting!"
  when:
    - rocm_setup_wsl_mode == 'legacy'
    - wslinfo.rc | default(0) != 0

- name: Copy the rocm-latest script to the host
  ansible.builtin.copy:
    src: rocm-latest
    dest: /usr/local/bin/rocm-latest
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Determine if latest lookups are needed
  ansible.builtin.set_fact:
    rocm_setup_need_rocm_latest: >-
      {{
        rocm_setup_repo_stream != 'therock'
        and rocm_setup_rocm_version == 'latest'
      }}
    rocm_setup_need_amdgpu_latest: >-
      {{
        rocm_setup_repo_stream != 'therock'
        and (rocm_setup_wsl_mode != 'legacy')
        and (rocm_setup_amdgpu_version == 'latest')
      }}
    rocm_setup_need_graphics_latest: >-
      {{
        rocm_setup_repo_stream != 'therock'
        and (not rocm_setup_wsl_enabled)
        and (rocm_setup_graphics_version == 'latest')
      }}
    rocm_setup_need_metrics_exporter_latest: >-
      {{
        (rocm_setup_install_metrics_exporter | default(false))
        and (rocm_setup_metrics_exporter_version | default('latest') == 'latest')
      }}

- name: Run the rocm-latest script and register results
  ansible.builtin.command:
    cmd: rocm-latest
  environment:
    QUIET: "true"
    ONLY_ONE: ROCM
    RADEON_REPO: "https://{{ rocm_setup_repo_base_url }}"
  register: rocm_latest_version
  changed_when: false
  when:
    - rocm_setup_need_rocm_latest
    - rocm_setup_wsl_mode != 'legacy'

- name: Run the rocm-latest script and register results (legacy wsl)
  ansible.builtin.command:
    cmd: rocm-latest
  environment:
    QUIET: "true"
    ONLY_ONE: ROCM
    WSL_INSTALL: "true"
    RADEON_REPO: "https://{{ rocm_setup_repo_base_url }}"
  register: rocm_latest_wsl_version
  changed_when: false
  when:
    - rocm_setup_need_rocm_latest
    - rocm_setup_wsl_mode == 'legacy'

- name: Run the rocm-latest script for AMDGPU version
  ansible.builtin.command:
    cmd: rocm-latest
  environment:
    QUIET: "true"
    ONLY_ONE: AMDGPU
    RADEON_REPO: "https://{{ rocm_setup_repo_base_url }}"
  register: amdgpu_latest_version
  changed_when: false
  when: rocm_setup_need_amdgpu_latest

- name: Run the rocm-latest script for graphics version
  ansible.builtin.command:
    cmd: rocm-latest
  environment:
    QUIET: "true"
    ONLY_ONE: GRAPHICS
    RADEON_REPO: "https://{{ rocm_setup_repo_base_url }}"
  register: graphics_latest_version
  changed_when: false
  when: rocm_setup_need_graphics_latest

- name: Run the rocm-latest script for device-metrics-exporter version
  ansible.builtin.command:
    cmd: rocm-latest
  environment:
    QUIET: "true"
    ONLY_ONE: METRICS_EXPORTER
    RADEON_REPO: "https://{{ rocm_setup_repo_base_url }}"
  register: metrics_exporter_latest_version
  changed_when: false
  when: rocm_setup_need_metrics_exporter_latest

- name: Print the rocm package version
  ansible.builtin.debug:
    msg: "rocm latest_version: {{ rocm_latest_version.stdout }}"
  when:
    - rocm_setup_need_rocm_latest
    - rocm_setup_wsl_mode != 'legacy'

- name: Print the rocm package version (legacy wsl)
  ansible.builtin.debug:
    msg: "rocm latest_wsl_version: {{ rocm_latest_wsl_version.stdout }}"
  when:
    - rocm_setup_need_rocm_latest
    - rocm_setup_wsl_mode == 'legacy'

- name: Print the amdgpu package version
  ansible.builtin.debug:
    msg: "amdgpu latest version: {{ amdgpu_latest_version.stdout }}"
  when: rocm_setup_need_amdgpu_latest

- name: Print the graphics package version
  ansible.builtin.debug:
    msg: "graphics latest version: {{ graphics_latest_version.stdout }}"
  when: rocm_setup_need_graphics_latest

- name: Print the device-metrics-exporter package version
  ansible.builtin.debug:
    msg: "device-metrics-exporter latest version: {{
      metrics_exporter_latest_version.stdout }}"
  when: rocm_setup_need_metrics_exporter_latest

- name: Populate rocm_setup_rocm_version variable
  ansible.builtin.set_fact:
    rocm_setup_rocm_version: "{{ rocm_latest_version.stdout }}"
  when:
    - rocm_setup_rocm_version == 'latest'
    - rocm_setup_wsl_mode != 'legacy'
    - rocm_setup_repo_stream != 'therock'

- name: Populate rocm_setup_rocm_version variable (legacy wsl)
  ansible.builtin.set_fact:
    rocm_setup_rocm_version: "{{ rocm_latest_wsl_version.stdout }}"
  when:
    - rocm_setup_rocm_version == 'latest'
    - rocm_setup_wsl_mode == 'legacy'
    - rocm_setup_repo_stream != 'therock'

- name: Populate rocm_setup_amdgpu_version variable
  ansible.builtin.set_fact:
    rocm_setup_amdgpu_version: "{{ amdgpu_latest_version.stdout }}"
  when: rocm_setup_need_amdgpu_latest

- name: Populate rocm_setup_amdgpu_version variable (legacy wsl)
  ansible.builtin.set_fact:
    rocm_setup_amdgpu_version: "{{ rocm_setup_rocm_version }}"
  when:
    - rocm_setup_amdgpu_version == 'latest'
    - rocm_setup_wsl_mode == 'legacy'
    - rocm_setup_repo_stream != 'therock'

- name: Populate rocm_setup_graphics_version variable
  ansible.builtin.set_fact:
    rocm_setup_graphics_version: "{{ graphics_latest_version.stdout }}"
  when: rocm_setup_need_graphics_latest

- name: Populate rocm_setup_metrics_exporter_version variable
  ansible.builtin.set_fact:
    rocm_setup_metrics_exporter_version: "{{
      metrics_exporter_latest_version.stdout }}"
  when: >-
    rocm_setup_metrics_exporter_version | default('latest') == 'latest'
    and rocm_setup_need_metrics_exporter_latest

- name: Fail if rocm_latest_version does not match rocm_setup_version
  ansible.builtin.fail:
    msg: "You are not requesting the latest rocm version!"
  when:
    - rocm_setup_need_rocm_latest
    - rocm_setup_wsl_mode != 'legacy'
    - rocm_latest_version.stdout != rocm_setup_rocm_version

- name: Fail if rocm_latest_wsl_version does not match rocm_setup_version (legacy wsl)
  ansible.builtin.fail:
    msg: "You are not requesting the latest rocm version!"
  when:
    - rocm_setup_need_rocm_latest
    - rocm_setup_wsl_mode == 'legacy'
    - rocm_latest_wsl_version.stdout | default('none') != rocm_setup_rocm_version

- name: Fail if amdgpu_latest_version does not match rocm_setup_amdgpu_version
  ansible.builtin.fail:
    msg: "You are not requesting the latest amdgpu version!"
  when:
    - rocm_setup_need_amdgpu_latest
    - amdgpu_latest_version.stdout != rocm_setup_amdgpu_version

- name: Fail if graphics_latest_version does not match
  ansible.builtin.fail:
    msg: "You are not requesting the latest graphics version!"
  when:
    - rocm_setup_need_graphics_latest
    - graphics_latest_version.stdout != rocm_setup_graphics_version

- name: Fail if metrics_exporter_latest_version does not match
  ansible.builtin.fail:
    msg: "You are not requesting the latest device-metrics-exporter version!"
  when:
    - rocm_setup_need_metrics_exporter_latest
    - metrics_exporter_latest_version.stdout | default('') !=
        (rocm_setup_metrics_exporter_version | default('latest'))

- name: Print out the ROCm version being installed
  ansible.builtin.debug:
    msg: "rocm_setup_rocm_version: {{ rocm_setup_rocm_version }}"

- name: Print out the AMDGPU version being installed
  ansible.builtin.debug:
    msg: "rocm_setup_amdgpu_version: {{ rocm_setup_amdgpu_version }}"

- name: Print out the graphics version being installed
  ansible.builtin.debug:
    msg: "rocm_setup_graphics_version: {{ rocm_setup_graphics_version }}"

- name: Print out the device-metrics-exporter version being installed
  ansible.builtin.debug:
    msg: "rocm_setup_metrics_exporter_version: {{
      rocm_setup_metrics_exporter_version }}"
  when: rocm_setup_install_metrics_exporter | default(false)

# --- TheRock stream: AMDGPU kernel driver version resolution ---
# The kernel driver packages live on repo.radeon.com/amdgpu/<version>/ubuntu,
# which is versioned independently from the ROCm userspace release on repo.amd.com.
# When rocm_setup_amdgpu_driver_version == 'latest' we discover the highest
# numeric version from the repo.radeon.com/amdgpu/ directory listing; otherwise
# the caller-supplied value is used directly (useful for CI pinning).

- name: Fetch repo.radeon.com/amdgpu/ directory index for version discovery
  ansible.builtin.uri:
    url: https://repo.radeon.com/amdgpu/
    return_content: true
  register: rocm_setup_amdgpu_dir_index
  when:
    - rocm_setup_repo_stream == 'therock'
    - rocm_setup_install_kernel_driver
    - not rocm_setup_wsl_enabled
    - rocm_setup_amdgpu_driver_version == 'latest'

- name: Resolve latest amdgpu driver version from directory listing
  ansible.builtin.set_fact:
    rocm_setup_amdgpu_driver_version_resolved: >-
      {{
        rocm_setup_amdgpu_dir_index.content
        | regex_findall('href="(\d+\.\d+(?:\.\d+)?)/"')
        | community.general.version_sort
        | last
      }}
  when:
    - rocm_setup_repo_stream == 'therock'
    - rocm_setup_install_kernel_driver
    - not rocm_setup_wsl_enabled
    - rocm_setup_amdgpu_driver_version == 'latest'

- name: Debug resolved amdgpu driver version
  ansible.builtin.debug:
    msg: "rocm_setup_amdgpu_driver_version_resolved: {{ rocm_setup_amdgpu_driver_version_resolved }}"
  when:
    - rocm_setup_repo_stream == 'therock'
    - rocm_setup_install_kernel_driver
    - not rocm_setup_wsl_enabled
    - rocm_setup_amdgpu_driver_version == 'latest'

- name: Use explicit amdgpu driver version (pinned)
  ansible.builtin.set_fact:
    rocm_setup_amdgpu_driver_version_resolved: "{{ rocm_setup_amdgpu_driver_version }}"
  when:
    - rocm_setup_repo_stream == 'therock'
    - rocm_setup_install_kernel_driver
    - not rocm_setup_wsl_enabled
    - rocm_setup_amdgpu_driver_version != 'latest'

# Every apt task below runs before main.yml writes rocm.sources, so a file left
# by an earlier run is still on disk at this point. After a stream switch, or a
# distro upgrade to a release the previously configured repo publishes no dist
# for, that file fails all of them — and the role never reaches the task that
# would have rewritten it, so the same failure repeats on every later run.
#
# Probe the refresh and drop the file only when it is what breaks it. On a
# healthy host nothing is removed, so main.yml's sources template still reports
# no change on a re-run.
- name: Check whether apt can refresh with the ROCm sources on disk  # noqa command-instead-of-module
  # The exit code is the signal, and the apt module masks it: with
  # failed_when: false the registered result reports failed: false, and it
  # burns five retry sleeps before giving up. Deliberately unconditional too:
  # detecting an unusable sources file means actually attempting the fetch, so
  # it cannot honour cache_valid_time either.
  ansible.builtin.command:
    cmd: apt-get update -qq
  register: rocm_setup_apt_refresh_check
  changed_when: false
  failed_when: false
  become: true

- name: Remove the ROCm sources file when it breaks the apt refresh
  ansible.builtin.file:
    path: "{{ rocm_setup_sources_file }}"
    state: absent
  become: true
  when: rocm_setup_apt_refresh_check.rc != 0

# The probe above just rebuilt the cache, so this refresh and the next one are
# provably redundant rather than merely probably redundant.
- name: Perform an update, upgrade and autoremove
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ rocm_setup_apt_cache_valid_time }}"
    upgrade: safe
    autoremove: true
  become: true
  when: not rocm_setup_skip_system_upgrade

- name: Perform a reboot to allow kernel updates
  ansible.builtin.reboot:
    reboot_timeout: "{{ rocm_setup_reboot_timeout }}"
  become: true
  when:
    - ansible_connection != 'local'
    - not rocm_setup_wsl_enabled
    - not rocm_setup_skip_reboot

- name: Re-gather kernel facts as the kernel may have changed
  # The setup module's filter matches its own return keys, which are
  # ansible_-prefixed, so this is not an ansible_facts[...] lookup.
  ansible.builtin.setup:
    filter:
      - ansible_kernel

- name: Install the prerequisite packages needed for ROCm install
  ansible.builtin.package:
    update_cache: true
    cache_valid_time: "{{ rocm_setup_apt_cache_valid_time }}"
    name:
      - python3-setuptools
      - python3-wheel
  become: true

- name: Check if linux-modules-extra exists for this kernel
  ansible.builtin.command:
    cmd: apt-cache show linux-modules-extra-{{ ansible_facts['kernel'] }}
  register: rocm_setup_modules_extra_check
  changed_when: false
  failed_when: false
  when: not rocm_setup_wsl_enabled

- name: Install the kernel header and extra modules
  ansible.builtin.package:
    update_cache: true
    cache_valid_time: "{{ rocm_setup_apt_cache_valid_time }}"
    name: >-
      {{ ['linux-generic', 'linux-headers-' + ansible_facts['kernel']]
         + (['linux-modules-extra-' + ansible_facts['kernel']]
            if rocm_setup_modules_extra_check.rc == 0
            else []) }}
  become: true
  when:
    - not rocm_setup_wsl_enabled
    - rocm_setup_install_kernel_driver

- name: Ensure the video and render groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - video
    - render
  become: true

- name: Ensure the requested user is a member of above groups
  ansible.builtin.user:
    name: "{{ rocm_setup_user }}"
    groups: "{{ item }}"
    append: true
  loop:
    - video
    - render
  become: true
  register: rocm_setup_group_membership

- name: Reset the connection so ROCm group membership takes effect
  ansible.builtin.meta: reset_connection
  when: rocm_setup_user == ansible_facts['user_id']
