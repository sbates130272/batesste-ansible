---
# Copyright (c) Stephen Bates, 2022
#
#
# Update cache and install favourite packages.

- name: Set a fact containing the current roles' path
  ansible.builtin.set_fact:
    fave_packages_calling_role_path_fact: "{{ role_path }}"

- name: Test the host platform to see if it can support this role
  ansible.builtin.include_role:
    name: sbates130272.batesste.check_platform
  vars:
    calling_role_path: "{{ fave_packages_calling_role_path_fact }}"  # noqa var-naming

- name: Clean leftover files out of the apt sources directory
  ansible.builtin.include_tasks: apt-sources-cleanup.yml
  when: fave_packages_apt_sources_cleanup_enable | bool

# Removing pipx or the apt ansible packages on the controller would delete
# the ansible that is running this play.  Leave them alone until the play
# runs from the uv-managed ansible this role installs further down.
- name: Check whether this play runs from an ansible the role would remove
  ansible.builtin.set_fact:
    fave_packages_ansible_in_use: >-
      {{ ansible_connection == 'local'
         and '/uv/tools/' not in ansible_playbook_python }}

- name: Warn that the superseded ansible is left in place on the controller
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} is running this play from
      {{ ansible_playbook_python }}, so pipx and the apt ansible packages
      are left in place.  Run the play again to finish the move to uv.
  when: fave_packages_ansible_in_use | bool

# The inventory sets ansible_become for every host, which overrides the
# become keyword, so the user-level tasks also clear it as a task var.
- name: Remove the links pipx left in the login user's home
  ansible.builtin.shell:
    cmd: >-
      find ~/.local/bin ~/.local/share/man -type l
      -lname '*/.local/share/pipx/*' -print -delete 2>/dev/null || true
  become: false
  vars:
    ansible_become: false
  register: fave_packages_pipx_links
  changed_when: fave_packages_pipx_links.stdout | length > 0
  when: not fave_packages_ansible_in_use | bool

- name: Remove the pipx home directory
  ansible.builtin.file:
    path: ~/.local/share/pipx
    state: absent
  become: false
  vars:
    ansible_become: false
  when: not fave_packages_ansible_in_use | bool

- name: Remove apt packages superseded by uv
  ansible.builtin.apt:
    name: >-
      {{ ['pipx']
         + (['ansible', 'ansible-core', 'ansible-lint']
            if fave_packages_ansible_enable | bool
               and fave_packages_uv_enable | bool else []) }}
    state: absent
  become: true
  when: not fave_packages_ansible_in_use | bool

- name: Install packages
  ansible.builtin.apt:
    name: >-
      {{ fave_packages_base
         + (fave_packages_desktop
            if fave_packages_desktop_enable | bool else [])
         + (['linux-generic']
            if fave_packages_linux_generic_enable | bool else [])
         + (fave_packages_node_exporter
            if fave_packages_node_exporter_enable | bool else [])
         + (['tmuxinator']
            if fave_packages_tmuxinator_enable | bool else [])
         + fave_packages_extra_packages }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  vars:
    fave_packages_base:
      - aspell
      - bmon
      - build-essential
      - cmake
      - driverctl
      - elpa-cmake-mode
      - elpa-rust-mode
      - expect
      - fio
      - gettext-base
      - gh
      - git
      - git-crypt
      - git-extras
      - gpg-agent
      - jq
      - libaio-dev
      - liburing-dev
      - python-is-python3
      - python3
      - python3-jinja2
      - python3-pip
      - python3-pytest
      - python3-venv
      - ripgrep
      - shellcheck
      - stow
      - sysstat
      - tmux
      - tree
      - virtiofsd
      - xfsprogs
    fave_packages_desktop:
      - emacs-nox
      - gnuplot
      - mutt
    fave_packages_node_exporter:
      - prometheus-node-exporter
      - prometheus-node-exporter-collectors

- name: Install or update uv
  when: fave_packages_uv_enable | bool
  vars:
    fave_packages_uv_latest: >-
      {{ fave_packages_uv_latest_release.json.tag_name | default('')
         | regex_replace('^v', '') }}
  block:
    - name: Look up the latest uv release
      ansible.builtin.uri:
        url: https://api.github.com/repos/astral-sh/uv/releases/latest
        return_content: true
        headers:
          Authorization: "{{ 'Bearer ' + fave_packages_github_api_token if fave_packages_github_api_token | length > 0 else omit }}"
      register: fave_packages_uv_latest_release
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the installed uv version
      ansible.builtin.command:
        cmd: /usr/local/bin/uv --version
      register: fave_packages_uv_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install uv and uvx into /usr/local/bin
      ansible.builtin.unarchive:
        src: >-
          https://github.com/astral-sh/uv/releases/download/{{
          fave_packages_uv_latest }}/uv-{{
          ansible_facts['architecture'] }}-unknown-linux-gnu.tar.gz
        dest: /usr/local/bin
        remote_src: true
        extra_opts:
          - --strip-components=1
        owner: root
        group: root
        mode: '0755'
      become: true
      when:
        - fave_packages_uv_latest_release.status | default(0) == 200
        - (fave_packages_uv_installed.stdout | default('')).split()[1:2]
          != [fave_packages_uv_latest]

    - name: Remove the version file earlier releases of this role wrote
      ansible.builtin.file:
        path: /usr/local/bin/.uv_version
        state: absent
      become: true

# A top-level key must come before any [table] in the file.
- name: Make uv trust the system certificate store for the login user
  ansible.builtin.lineinfile:
    path: ~/.config/uv/uv.toml
    regexp: '^(system-certs|native-tls)\s*='
    line: system-certs = true
    insertbefore: BOF
    create: true
    mode: '0644'
  become: false
  vars:
    ansible_become: false
  when:
    - fave_packages_uv_enable | bool
    - fave_packages_uv_system_certs | bool

# One uv tool environment holds ansible, ansible-core and ansible-lint, so
# ansible-lint runs against the same ansible the user does, plus jmespath
# for the json_query filter (see requirements.txt).  It must be
# installed as the login user, never root, whatever become the caller or
# the inventory applies.
- name: Install ansible and ansible-lint for the login user via uv
  ansible.builtin.command:
    argv: >-
      {{ ['uv', 'tool', 'install']
         + (['--force'] if fave_packages_ansible_in_use | bool else [])
         + ['--with-executables-from', 'ansible-core,ansible-lint',
            '--with', 'jmespath', 'ansible'] }}
  become: false
  vars:
    ansible_become: false
  register: fave_packages_uv_ansible
  changed_when: "'already installed' not in fave_packages_uv_ansible.stderr"
  when:
    - fave_packages_ansible_enable | bool
    - fave_packages_uv_enable | bool

- name: Configure node exporter extra collectors
  ansible.builtin.template:
    src: prometheus-node-exporter.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart prometheus-node-exporter
  when: fave_packages_node_exporter_enable | bool
