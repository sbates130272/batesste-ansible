#
# rocm_hipfile_setup is deprecated as of ROCm 7.14.
# hipFile and fio-libhipfile are now installed by rocm_setup via apt.
#
# Migration: set rocm_setup_install_hipfile: true in rocm_setup instead.
# To suppress this error and allow the old role to be present but silent,
# set rocm_hipfile_setup_allow_deprecated: true.

- name: Notify that this role (rocm_hipfile_setup) is deprecated
  ansible.builtin.fail:
    msg: >-
      rocm_hipfile_setup is deprecated as of ROCm 7.14. hipFile and
      fio-libhipfile are now native APT packages installed by rocm_setup
      when rocm_setup_install_hipfile: true. Remove rocm_hipfile_setup
      from your playbooks and set that variable instead.
      To silence this error temporarily, set
      rocm_hipfile_setup_allow_deprecated: true.
  when: not rocm_hipfile_setup_allow_deprecated | default(false)
