# defaults file for rdma_setup
rdma_setup_reboot: false
rdma_setup_reboot_timeout: 60

# Skip apt safe-upgrade/autoremove pass. Set to true in CI where full distro
# upgrades are slow and unnecessary.
rdma_setup_skip_system_upgrade: false
rdma_detect_output_file: /tmp/rdma-detect.status
rdma_detect_script_dest: /usr/local/bin/rdma-detect

# Enable MOTD showing RDMA/InfiniBand devices
rdma_setup_motd: false

# Optional: install Prometheus rdma_exporter (https://github.com/yuuki/rdma_exporter)
rdma_setup_install_rdma_exporter: false
rdma_exporter_version: "0.7.3"
rdma_exporter_install_dir: "/usr/local/bin"
rdma_exporter_listen_address: ":9879"
rdma_exporter_metrics_path: "/metrics"
rdma_exporter_health_path: "/health"
rdma_exporter_exclude_devices: ""

# Optional: install rdmatop RDMA monitoring tool
rdma_setup_install_rdmatop: true

# ── nicctl ───────────────────────────────────────────────────────────────────
# AMD Pensando NIC management tool for Pollara/Salina NICs. Installed from the
# AMD Pensando APT repository, which is unsigned (trusted=yes).
#
# nicctl-common is the frontend dispatcher; nicctl-ainic-vulcano-rudra-pulsar
# is the backend for Pollara (Salina ASIC) NICs. The hydra backend is for a
# different platform and is not installed here.
#
# Version is the full directory name under repo.radeon.com/amdainic/pensando/ubuntu/;
# bump it to match the firmware revision under test.
rdma_setup_install_nicctl: false
rdma_setup_nicctl_version: "1.130.9-a-3"
rdma_setup_nicctl_repo_base: "https://repo.radeon.com/amdainic/pensando/ubuntu"
rdma_setup_nicctl_repo_dist: "{{ ansible_facts['distribution_release'] }}"
rdma_setup_nicctl_packages:
  - nicctl-common
  - nicctl-ainic-vulcano-rudra-pulsar
