---
- name: Set a fact containing the current roles' path
  ansible.builtin.set_fact:
    amd_llm_exporter_calling_role_path_fact: "{{ role_path | default('') }}"

- name: Test the host platform to see if it can support this role
  ansible.builtin.include_role:
    name: sbates130272.batesste.check_platform
  vars:
    calling_role_path: "{{ amd_llm_exporter_calling_role_path_fact }}"
  when: amd_llm_exporter_calling_role_path_fact | length > 0

- name: Install python3-venv
  ansible.builtin.package:
    name: python3-venv
    state: present
  become: true

- name: Create amd-llm-exporter system user
  ansible.builtin.user:
    name: "{{ amd_llm_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Create install directory
  ansible.builtin.file:
    path: "{{ amd_llm_exporter_install_dir }}"
    state: directory
    owner: "{{ amd_llm_exporter_user }}"
    group: "{{ amd_llm_exporter_user }}"
    mode: "0755"
  become: true

- name: Create Python venv
  ansible.builtin.command:
    cmd: python3 -m venv {{ amd_llm_exporter_install_dir }}/venv
    creates: "{{ amd_llm_exporter_install_dir }}/venv/bin/python3"
  become: true
  become_user: "{{ amd_llm_exporter_user }}"

- name: Install Python dependencies in venv
  ansible.builtin.pip:
    name:
      - prometheus-client
      - requests
    virtualenv: "{{ amd_llm_exporter_install_dir }}/venv"
  become: true
  become_user: "{{ amd_llm_exporter_user }}"

- name: Deploy exporter script
  ansible.builtin.copy:
    src: amd_llm_exporter.py
    dest: "{{ amd_llm_exporter_install_dir }}/amd_llm_exporter.py"
    owner: "{{ amd_llm_exporter_user }}"
    group: "{{ amd_llm_exporter_user }}"
    mode: "0755"
  become: true
  notify: Restart amd-llm-exporter

- name: Deploy environment file
  ansible.builtin.template:
    src: amd_llm_exporter.env.j2
    dest: "{{ amd_llm_exporter_install_dir }}/amd_llm_exporter.env"
    owner: "{{ amd_llm_exporter_user }}"
    group: "{{ amd_llm_exporter_user }}"
    mode: "0600"
  become: true
  no_log: true
  notify: Restart amd-llm-exporter

- name: Deploy systemd unit
  ansible.builtin.template:
    src: amd_llm_exporter.service.j2
    dest: /etc/systemd/system/amd-llm-exporter.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart amd-llm-exporter

- name: Enable and start amd-llm-exporter
  ansible.builtin.systemd:
    name: amd-llm-exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for exporter to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ amd_llm_exporter_port }}/metrics"
    status_code: 200
  register: amd_llm_exporter_health
  until: amd_llm_exporter_health.status == 200
  retries: 12
  delay: 5
  changed_when: false

- name: Show exporter metrics URL
  ansible.builtin.debug:
    msg: "AMD LLM exporter: http://{{ inventory_hostname }}:{{ amd_llm_exporter_port }}/metrics"
