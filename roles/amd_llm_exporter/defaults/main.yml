amd_llm_exporter_port: 9876
amd_llm_exporter_window_days: 30
amd_llm_exporter_refresh_seconds: 300
amd_llm_exporter_endpoint: "https://llm-api.amd.com/api/UsageStats"
amd_llm_exporter_install_dir: /opt/amd_llm_exporter
amd_llm_exporter_user: amd-llm-exporter

# Full "Header-Name: value" string — set via vault.
