# Install lemonade-server from the official PPA.

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download lemonade-team PPA signing key
  ansible.builtin.get_url:
    url: "{{ lemonade_setup_ppa_key_url }}"
    dest: /etc/apt/keyrings/lemonade-team.asc
    mode: "0644"
  become: true

- name: Dearmor lemonade-team PPA signing key
  ansible.builtin.command:
    cmd: >-
      gpg --dearmor -o /usr/share/keyrings/lemonade-team.gpg
      /etc/apt/keyrings/lemonade-team.asc
    creates: /usr/share/keyrings/lemonade-team.gpg
  become: true

- name: Ensure lemonade-team GPG keyring is world-readable
  ansible.builtin.file:
    path: /usr/share/keyrings/lemonade-team.gpg
    mode: "0644"
  become: true

- name: Determine dpkg architecture for lemonade repo
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: lemonade_setup_dpkg_arch
  changed_when: false

- name: Remove all lemonade-team source files before writing canonical one
  ansible.builtin.shell:
    cmd: rm -f /etc/apt/sources.list.d/lemonade*.list /etc/apt/sources.list.d/lemonade*.sources
  become: true
  changed_when: false

- name: Write lemonade-team deb822 sources file
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://ppa.launchpadcontent.net/lemonade-team/stable/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: main
      Architectures: {{ lemonade_setup_dpkg_arch.stdout }}
      Signed-By: /usr/share/keyrings/lemonade-team.gpg
    dest: /etc/apt/sources.list.d/lemonade-team.sources
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Update apt cache for lemonade PPA only
  ansible.builtin.command:
    cmd: >-
      apt-get update
      -o Dir::Etc::sourcelist="sources.list.d/lemonade-team.sources"
      -o Dir::Etc::sourceparts="-"
      -o APT::Get::List-Cleanup="0"
  become: true
  changed_when: false

- name: Install lemonade-server package
  ansible.builtin.package:
    name: lemonade-server
    state: present
  become: true
