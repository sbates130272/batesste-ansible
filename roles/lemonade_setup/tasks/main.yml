#
# Install and configure Lemonade LLM server (lemond) with a systemd
# drop-in for API auth and a tailscale serve proxy for TLS exposure.
#
# See this Role's README.md for more information.

- name: Set a fact containing the current roles' path
  ansible.builtin.set_fact:
    lemonade_setup_calling_role_path_fact: "{{ role_path }}"

- name: Test the host platform to see if it can support this role
  ansible.builtin.include_role:
    name: sbates130272.batesste.check_platform
  vars:
    calling_role_path: "{{ lemonade_setup_calling_role_path_fact }}"

- name: Validate install method
  ansible.builtin.assert:
    that:
      - lemonade_setup_install_method in ['deb', 'source', 'snap']
    fail_msg: >-
      lemonade_setup_install_method must be one of:
      deb, source, snap (got '{{ lemonade_setup_install_method }}')

- name: Run rocm_setup role for ROCm backend support
  ansible.builtin.include_role:
    name: sbates130272.batesste.rocm_setup
  when:
    - lemonade_setup_llamacpp_backend == 'rocm'
    - lemonade_setup_run_rocm_setup

- name: Install lemonade-server via deb package
  ansible.builtin.include_tasks: install-deb.yml
  when: lemonade_setup_install_method == 'deb'

- name: Install lemonade-server from source
  ansible.builtin.include_tasks: install-source.yml
  when: lemonade_setup_install_method == 'source'

- name: Install lemonade-server via snap
  ansible.builtin.include_tasks: install-snap.yml
  when: lemonade_setup_install_method == 'snap'

- name: Remove legacy lemonade artifacts
  ansible.builtin.include_tasks: cleanup-legacy.yml

- name: Assert required lemonade backends are installed
  ansible.builtin.include_tasks: backends.yml
  when: lemonade_setup_backends | length > 0

- name: Create /etc/lemonade configuration directory
  ansible.builtin.file:
    path: /etc/lemonade
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Template lemonade auth secrets
  ansible.builtin.template:
    src: lemonade-auth.env.j2
    dest: /etc/lemonade/lemonade-auth.env
    owner: root
    group: root
    mode: "0600"
  become: true
  notify:
    - Reload systemd
    - Restart lemond

- name: Create lemond systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/lemond.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install auth drop-in for lemond.service
  ansible.builtin.template:
    src: 10-auth.conf.j2
    dest: /etc/systemd/system/lemond.service.d/10-auth.conf
    owner: root
    group: root
    mode: "0600"
  become: true
  notify:
    - Reload systemd
    - Restart lemond

- name: Apply lemonade server configuration via config set
  ansible.builtin.command:
    cmd: >-
      lemonade config set
      port={{ lemonade_setup_port }}
      log_level={{ lemonade_setup_log_level }}
      max_loaded_models={{ lemonade_setup_max_loaded_models }}
      ctx_size={{ lemonade_setup_ctx_size }}
      no_broadcast={{ lemonade_setup_no_broadcast | lower }}
      inhibit_suspend={{ lemonade_setup_inhibit_suspend | lower }}
      llamacpp.backend={{ lemonade_setup_llamacpp_backend }}
      llamacpp.rocm_bin={{ lemonade_setup_llamacpp_rocm_bin }}
      {% if lemonade_setup_llamacpp_rocm_args %}
      llamacpp.rocm_args={{ lemonade_setup_llamacpp_rocm_args | quote }}
      {% endif %}
  environment:
    LEMONADE_API_KEY: "{{ lemonade_setup_api_key }}"
    LEMONADE_ADMIN_API_KEY: "{{ lemonade_setup_admin_api_key }}"
  become: true
  become_user: lemonade
  register: lemonade_setup_config_result
  changed_when: lemonade_setup_config_result.stdout != ''
  notify: Restart lemond

- name: Flush handlers to apply systemd changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start lemond service
  ansible.builtin.systemd:
    name: lemond
    enabled: "{{ lemonade_setup_start_service }}"
    state: "{{ 'started' if lemonade_setup_start_service else 'stopped' }}"
  become: true

- name: Configure tailscale serve for lemond
  ansible.builtin.include_tasks: tailscale-serve.yml
  when: lemonade_setup_tailscale_serve
