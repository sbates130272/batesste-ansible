# insecure-registries is re-read on SIGHUP; a full restart is unnecessary
# and on snoc-strix/snoc-beelink would kill running containers.
# Exception: *removing* a registry requires a restart — handle that manually.
- name: Reload docker
  ansible.builtin.service:
    name: docker
    state: reloaded
  become: true
  when: registry_client_reload_docker | bool
