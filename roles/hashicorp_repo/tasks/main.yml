#
# Add the HashiCorp APT repository and GPG key.
# Extracted from consul_setup and fave_packages to avoid duplication.

- name: Download HashiCorp GPG key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /etc/apt/keyrings/hashicorp-archive-keyring.asc
    mode: "0644"
  become: true

- name: Dearmor HashiCorp GPG key
  ansible.builtin.command:
    cmd: >-
      gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      /etc/apt/keyrings/hashicorp-archive-keyring.asc
  become: true
  changed_when: false

- name: Verify HashiCorp GPG key fingerprint
  ansible.builtin.command:
    cmd: >-
      gpg --no-default-keyring
      --keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg
      --fingerprint
  register: hashicorp_repo_fingerprint
  changed_when: false
  become: true
  failed_when: >-
    'D55C0D1AC78A8D8126CB631CFC9CA96ACA026560' not in
    hashicorp_repo_fingerprint.stdout | replace(' ', '') | upper

- name: Ensure HashiCorp GPG keyring is world-readable
  ansible.builtin.file:
    path: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    mode: "0644"
  become: true

- name: Determine dpkg architecture for HashiCorp repo
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: hashicorp_repo_dpkg_arch
  changed_when: false

- name: Add HashiCorp APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ hashicorp_repo_dpkg_arch.stdout }}
      signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg]
      https://apt.releases.hashicorp.com
      {{ ansible_facts['distribution_release'] }} main
    filename: hashicorp
    state: present
  become: true
