#
# Install the Claude CLI and configure it to route through
# a local nginx reverse proxy that tunnels requests to the
# configured LLM backend (e.g. a remote Lemonade server).
#
# See this Role's README.md for more information.

- name: Set a fact containing the current roles' path
  ansible.builtin.set_fact:
    claude_setup_calling_role_path_fact: "{{ role_path }}"

- name: Test the host platform to see if it can support this role
  ansible.builtin.include_role:
    name: sbates130272.batesste.check_platform
  vars:
    calling_role_path: "{{ claude_setup_calling_role_path_fact }}"

- name: Install Node.js and npm
  ansible.builtin.package:
    name:
      - nodejs
      - npm
    state: present
    update_cache: true
  become: true
  when:
    - claude_setup_install_nodejs
    - not claude_setup_unprivileged | default(false)

- name: Install the Claude CLI via npm
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: present
  become: true
  when: not claude_setup_unprivileged | default(false)

- name: Install nvm (user-local, unprivileged)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/{{ claude_setup_nvm_version }}/install.sh | bash
    creates: "{{ ansible_env.HOME }}/.nvm/nvm.sh"
  args:
    executable: /bin/bash
  when: claude_setup_unprivileged | default(false)

- name: Install Node.js LTS and Claude CLI via nvm (user-local, unprivileged)
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="{{ ansible_env.HOME }}/.nvm"
      . "$NVM_DIR/nvm.sh"
      nvm install {{ claude_setup_node_version }}
      nvm use {{ claude_setup_node_version }}
      nvm alias default {{ claude_setup_node_version }}
      npm install -g @anthropic-ai/claude-code
    executable: /bin/bash
  changed_when: true
  when: claude_setup_unprivileged | default(false)

- name: Install nginx for the LLM reverse proxy
  ansible.builtin.package:
    name: nginx
    state: present
  become: true
  when: not claude_setup_unprivileged | default(false)

- name: Deploy the Claude reverse proxy nginx site config
  ansible.builtin.template:
    src: claude-proxy.conf.j2
    dest: /etc/nginx/sites-available/claude-proxy
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload nginx
  when: not claude_setup_unprivileged | default(false)

- name: Enable the Claude reverse proxy nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/claude-proxy
    dest: /etc/nginx/sites-enabled/claude-proxy
    state: link
  become: true
  notify: Reload nginx
  when: not claude_setup_unprivileged | default(false)

- name: Ensure nginx is started and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  become: true
  when: not claude_setup_unprivileged | default(false)

- name: Flush handlers to apply nginx config
  ansible.builtin.meta: flush_handlers

- name: Create the Claude configuration directory
  ansible.builtin.file:
    path: "~/.claude"
    state: directory
    mode: "0755"

- name: Template the Claude settings file
  ansible.builtin.template:
    src: claude-settings.json.j2
    dest: "~/.claude/settings.json"
    mode: "0644"
  when: not claude_setup_dotfiles_enable | default(false)

- name: Template the Claude secrets file
  ansible.builtin.template:
    src: claude-secrets.sh.j2
    dest: "~/.claude/secrets.sh"
    mode: "0600"
  no_log: true
  when: claude_setup_api_key | length > 0 or claude_setup_apim_key | length > 0

- name: Configure Claude environment in .bashrc
  ansible.builtin.blockinfile:
    path: "~/.bashrc"
    state: present
    marker_begin: BEGIN (claude_setup)
    marker_end: END (claude_setup)
    block: |
      # Source Claude CLI secrets (API key and proxy URL)
      [ -f ~/.claude/secrets.sh ] && source ~/.claude/secrets.sh
  when: not claude_setup_unprivileged | default(false)

- name: Configure Claude environment in .bashrc (unprivileged)
  ansible.builtin.blockinfile:
    path: "~/.bashrc"
    state: present
    marker_begin: BEGIN (claude_setup)
    marker_end: END (claude_setup)
    block: |
      # Source Claude CLI secrets (API key and proxy URL)
      [ -f ~/.claude/secrets.sh ] && source ~/.claude/secrets.sh
      # nvm (Node Version Manager) - installed without root for Claude CLI
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
  when: claude_setup_unprivileged | default(false)
