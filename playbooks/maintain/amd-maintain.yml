#
# Weekly maintenance playbook for AMD machines.
# Intended to be run from amd-laptop (the control node).
#
# amd-laptop runs locally (connection: local); amd_fleet is reached via SSH.
#
# ansible-playbook playbooks/maintain/amd-maintain.yml -e @playbooks/secrets.yml

- name: Update amd-laptop (local)
  hosts: amd-laptop
  gather_facts: true
  vars:
    ansible_connection: local
  roles:
    - role: fave_packages
      become: true
    - role: rocm_setup

- name: Deploy dotfiles to amd-laptop (local)
  import_playbook: ../dotfiles/deploy.yml
  vars:
    targets: amd-laptop

- name: Update amd_fleet (SSH)
  hosts: amd_fleet
  gather_facts: true
  roles:
    - role: fave_packages
      become: true

- name: Deploy dotfiles to amd_fleet
  import_playbook: ../dotfiles/deploy.yml
  vars:
    targets: amd_fleet
