- name: Deploy dotfiles
  hosts: "{{ targets }}"
  gather_facts: true

  pre_tasks:
    - name: Skip dotfiles deploy if disabled for this host
      meta: end_host
      when: not (dotfiles_deploy | default(true) | bool)

  tasks:
    - name: Install prerequisites
      ansible.builtin.package:
        name:
          - git
          - git-crypt
          - gnupg
          - stow
          - gettext-base
        state: present
      become: true
      when:
        - ansible_connection != 'local'
        - dotfiles_install_prereqs | default(false)

    - name: Resolve latest dotfiles release tag from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/sbates130272/batesste-dotfiles/releases/latest"
        return_content: true
        headers:
          Accept: "application/vnd.github+json"
          Authorization: "{{ ('Bearer ' + vault_github_token) if vault_github_token | default('') | length > 0 else omit }}"
      register: _dotfiles_latest_release
      when: dotfiles_version == "latest"

    - name: Clone or update dotfiles repo
      ansible.builtin.git:
        repo: "{{ dotfiles_repo }}"
        dest: "{{ dotfiles_dir }}"
        version: >-
          {{
            (_dotfiles_latest_release.json.tag_name
             if (dotfiles_version == 'latest' and _dotfiles_latest_release is not skipped)
             else dotfiles_version)
          }}
        update: true
        force: "{{ dotfiles_force | default(false) }}"
      environment:
        GIT_SSL_CAINFO: "{{ dotfiles_git_ssl_cainfo }}"
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
      when: ansible_connection != 'local'

    - name: Unlock git-crypt
      ansible.builtin.shell:
        cmd: "set -o pipefail && printf '%s' {{ vault_git_crypt_key_b64 | quote }} | base64 -d | git-crypt unlock -"
        chdir: "{{ dotfiles_dir }}"
        executable: /bin/bash
      environment:
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
      no_log: true
      changed_when: true
      when:
        - ansible_connection != 'local'
        - vault_git_crypt_key_b64 | default('') | length > 0

    - name: Import GPG private key into user keyring
      when:
        - ansible_connection != 'local'
        - user_setup_gpg_private_key | default('') | length > 0
      no_log: true
      block:
        - name: Write GPG private key to tempfile
          ansible.builtin.tempfile:
            state: file
            suffix: .asc
          register: _dotfiles_gpg_tempfile

        - name: Copy armored GPG private key into tempfile
          ansible.builtin.copy:
            content: "{{ user_setup_gpg_private_key }}"
            dest: "{{ _dotfiles_gpg_tempfile.path }}"
            mode: "0600"

        - name: Import GPG private key
          ansible.builtin.command:
            cmd: "gpg --batch --import {{ _dotfiles_gpg_tempfile.path }}"
          changed_when: true

      always:
        - name: Remove GPG private key tempfile
          ansible.builtin.file:
            path: "{{ _dotfiles_gpg_tempfile.path }}"
            state: absent
          when: _dotfiles_gpg_tempfile is defined

    - name: Get dotfiles version
      ansible.builtin.command:
        cmd: "git describe --tags --always --long"
        chdir: "{{ dotfiles_dir }}"
      register: dotfiles_version_out
      changed_when: false
      # noqa: command-instead-of-module - git describe has no module equivalent

    - name: Show dotfiles version
      ansible.builtin.debug:
        msg: "dotfiles version: {{ dotfiles_version_out.stdout }}"

    - name: Show install.sh flags
      ansible.builtin.debug:
        msg: >-
          install.sh flags:
          {{ '--proxy' if dotfiles_proxy | default(false) | bool else '(no proxy)' }}
          {{ '--force' if dotfiles_force | default(false) | bool else '(no force)' }}

    - name: Run install.sh
      ansible.builtin.command:
        cmd: >-
          ./install.sh
          {{ '--proxy' if dotfiles_proxy | default(false) | bool else '' }}
          {{ '--force' if dotfiles_force | default(false) | bool else '' }}
        chdir: "{{ dotfiles_dir }}"
      environment:
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
        PERL5LIB: "{{ ansible_facts['env']['HOME'] }}/.local/lib/perl5"
      register: install_result
      changed_when: true

    - name: Show install.sh output
      ansible.builtin.debug:
        msg: "{{ install_result.stdout_lines + install_result.stderr_lines }}"
