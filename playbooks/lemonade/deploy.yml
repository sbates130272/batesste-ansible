# Deploy the lemonade LLM server to one or more hosts.
#
# Usage:
#   ansible-playbook playbooks/lemonade/deploy.yml \
#     -e targets=<host-or-group> \
#     --vault-password-file playbooks/vault-password \
#     -e @playbooks/secrets.yml

- name: Deploy lemonade server
  hosts: "{{ targets | default('lemonade_servers') }}"
  gather_facts: true

  tasks:
    - name: Include lemonade_setup role
      ansible.builtin.include_role:
        name: sbates130272.batesste.lemonade_setup
