---
namespace: sbates130272
name: batesste
version: 2.3.0
readme: README.md

authors:
  - Stephen Bates <stephen@raithlin.com>

description: >-
  Ansible roles for configuring Ubuntu bare-metal and VM
  servers including ROCm/AI/LLM tooling (Lemonade, ROCm-CLI,
  Claude Code), Docker, Grafana, QEMU/KVM, RDMA, NVMe-oF,
  NVMe exporter, and more.

license:
  - Apache-2.0

tags:
  - linux
  - infrastructure
  - tools
  - monitoring
  - storage
  - llm
  - lemonade
  - rocm
  - amd
  - ai

dependencies:
  ansible.posix: ">=2.2.2"
  community.general: ">=13.3.0"
  community.libvirt: ">=2.3.0"
  amazon.aws: ">=11.4.0"

repository: https://github.com/sbates130272/batesste-ansible
documentation: https://github.com/sbates130272/batesste-ansible
homepage: https://github.com/sbates130272/batesste-ansible
issues: https://github.com/sbates130272/batesste-ansible/issues

build_ignore:
  - .ansible-lint
  - .claude
  - .cline_storage
  - .github
  - .gitignore
  - .mypy_cache
  - .python-version
  - .spellcheck.yml
  - .wordlist.txt
  - collections
  - dictionary.dic
  - inventory
  - playbooks
  - requirements.txt
  - requirements.yml
  - tests
  - "*.tar.gz"
  - "roles/*/hosts-*"
  - "roles/*/tests"
  - "roles/*/files/*.token"
  - "roles/*/files/*-key.pem"
