ansible_host: 10.0.0.107
ansible_connection: local
ansible_user: stebates
username: stebates
rocm_setup_repo_stream: therock
rocm_setup_wsl: rocdxg
rocm_setup_run_checks: true
# gfx1151 (Strix Halo) requires HSA_ENABLE_DXG_DETECTION even on therock
rocm_setup_wsl_hsa_enable_dxg_detection: true
rocm_setup_wsl_run_hip_check: true
rocm_setup_install_metrics_exporter: true
# Skip dotfiles during maintenance — amd-laptop is the dotfiles dev machine.
# Override with -e dotfiles_deploy=true to force a deploy.
dotfiles_deploy: false

lemonade_setup_port: 13306
lemonade_setup_llamacpp_backend: rocm
lemonade_setup_llamacpp_rocm_args: "-fa on -ctk q8_0 -ctv q8_0"
lemonade_setup_llamacpp_rocm_bin: "latest"
lemonade_setup_run_rocm_setup: false
# Tailscale runs natively on Windows on this WSL2 host; run manually:
#   tailscale serve --bg --https=13305 http://127.0.0.1:13305
lemonade_setup_tailscale_serve: false
# gfx1151: same backend set as snoc-strix
lemonade_setup_backends:
  - llamacpp:rocm
  - llamacpp:vulkan
  - llamacpp:cpu
